<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Katie in the Earth</title>
  <style>
    :root {
      --bg: #040b12;
      --text: #edf6ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    #globeViz {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #titleOverlay {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: flex-end;
      gap: clamp(12px, 1.4vw, 22px);
      pointer-events: none;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.72));
    }

    .letter-card {
      position: relative;
      background: rgba(12, 18, 26, 0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(2px);
      transition: filter 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      pointer-events: auto;
      cursor: pointer;
    }

    .letter-card.active {
      filter: brightness(1.08);
    }

    .letter-card img {
      display: block;
      width: auto;
      height: clamp(150px, 18vw, 240px);
      object-fit: cover;
      pointer-events: none;
      background: rgba(0,0,0,0.15);
    }

    #infoPanel {
      position: fixed;
      right: 26px;
      top: 50%;
      transform: translateY(-50%) translateY(12px);
      z-index: 12;
      max-width: min(420px, calc(100vw - 48px));
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(8, 14, 20, 0.7);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 36px rgba(0,0,0,0.32);
      color: rgba(237, 245, 255, 0.95);
      backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      text-align: left;
    }

    #infoPanel.visible {
      opacity: 1;
      transform: translateY(-50%) translateY(0);
    }

    #infoTitle {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #infoText {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(214, 230, 245, 0.84);
    }

    #infoCoords {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(186, 214, 255, 0.9);
    }

    #earthSignature {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 12;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(235, 242, 255, 0.78);
      text-shadow: 0 4px 18px rgba(0,0,0,0.45);
      white-space: nowrap;
    }

    #earthSignature .heart {
      color: #ff5b6e;
    }

    #globePin {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      border-radius: 50% 50% 50% 0;
      background: #ff5b6e;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 7px rgba(255, 91, 110, 0.2);
      transform: translate(-50%, -100%) rotate(-45deg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, left 120ms linear, top 120ms linear;
      z-index: 11;
    }

    #globePin::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }

    #time {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 12;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(214, 230, 245, 0.85);
      background: rgba(9, 15, 22, 0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 12px;
    }

    #audioControls {
      position: fixed;
      right: 26px;
      bottom: 18px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(9, 15, 22, 0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
    }

    #audioToggle {
      appearance: none;
      border: none;
      background: #ff5b6e;
      color: white;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255, 91, 110, 0.28);
    }

    #audioToggle.muted {
      background: rgba(255,255,255,0.12);
      box-shadow: none;
    }

    @media (max-width: 720px) {
      #titleOverlay {
        top: 18px;
      }

      .letter-card img {
        height: clamp(74px, 18vw, 120px);
      }
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>

  <div id="titleOverlay" aria-label="Katie written with landscape images">
    <div class="letter-card" data-letter="k"><img src="letters/k/k-0-SirmilikNationalPark-Canada.png" alt="K" /></div>
    <div class="letter-card" data-letter="a"><img src="letters/a/a-0-hickman-Kentucky.png" alt="A" /></div>
    <div class="letter-card" data-letter="t"><img src="letters/t/t-0-Liwa-United Arab Emirates.png" alt="T" /></div>
    <div class="letter-card" data-letter="i"><img src="letters/i/i-0-Borgarbyggð-Iceland.png" alt="I" /></div>
    <div class="letter-card" data-letter="e"><img src="letters/e/e-0-FirnfilledFjords-Tibet.png" alt="E" /></div>
  </div>

  <div id="infoPanel" aria-live="polite">
    <h2 id="infoTitle">Katie</h2>
    <p id="infoText">Click a letter to see a place inspiration.</p>
    <span id="infoCoords">Coordinates: --</span>
  </div>

  <div id="earthSignature">written in the earth <span class="heart">❤</span></div>
  <div id="globePin" aria-hidden="true"></div>

  <div id="time">00:00</div>

  <div id="audioControls" aria-label="Audio controls">
    <button id="audioToggle" type="button" aria-label="Toggle audio">🔊</button>
  </div>

  <audio id="backgroundAudio" loop preload="auto" src="Liang Lawrence - Endless Sundays (Official Visualiser).mp3"></audio>

  <script src="//cdn.jsdelivr.net/npm/globe.gl"></script>
  <script type="module">
    import { TextureLoader, ShaderMaterial, Vector2 } from 'https://esm.sh/three';
    import * as solar from 'https://esm.sh/solar-calculator';

    const VELOCITY = 1;

    const dayNightShader = {
      vertexShader: `
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        #define PI 3.141592653589793
        uniform sampler2D dayTexture;
        uniform sampler2D nightTexture;
        uniform vec2 sunPosition;
        uniform vec2 globeRotation;
        varying vec3 vNormal;
        varying vec2 vUv;

        float toRad(in float a) {
          return a * PI / 180.0;
        }

        vec3 Polar2Cartesian(in vec2 c) {
          float theta = toRad(90.0 - c.x);
          float phi = toRad(90.0 - c.y);
          return vec3(
            sin(phi) * cos(theta),
            cos(phi),
            sin(phi) * sin(theta)
          );
        }

        void main() {
          float invLon = toRad(globeRotation.x);
          float invLat = -toRad(globeRotation.y);
          mat3 rotX = mat3(
            1, 0, 0,
            0, cos(invLat), -sin(invLat),
            0, sin(invLat), cos(invLat)
          );
          mat3 rotY = mat3(
            cos(invLon), 0, sin(invLon),
            0, 1, 0,
            -sin(invLon), 0, cos(invLon)
          );
          vec3 rotatedSunDirection = rotX * rotY * Polar2Cartesian(sunPosition);
          float intensity = dot(normalize(vNormal), normalize(rotatedSunDirection));
          vec4 dayColor = texture2D(dayTexture, vUv);
          vec4 nightColor = texture2D(nightTexture, vUv);
          float blendFactor = smoothstep(-0.1, 0.1, intensity);
          gl_FragColor = mix(nightColor, dayColor, blendFactor);
        }
      `
    };

    const letterOptions = {
      k: [
        'letters/k/k-0-SirmilikNationalPark-Canada.png',
        'letters/k/k-1-Golmund-China.png'
      ],
      a: [
        'letters/a/a-0-hickman-Kentucky.png',
        'letters/a/a-1-FarmIsland-Maine.png',
        'letters/a/a-2-guakhmaz-azerbaijan.png',
        'letters/a/a-3-YukonDelta-Alaska.png',
        'letters/a/a-4-Lake-Mjøsa-Norway.png'
      ],
      t: [
        'letters/t/t-0-Liwa-United Arab Emirates.png',
        'letters/t/t-1-LenaRiverDelta.png'
      ],
      i: [
        'letters/i/i-0-Borgarbyggð-Iceland.png',
        'letters/i/i-1-Canandaigua-Lake-NewYork.png',
        'letters/i/i-2-EtoshaNationalPark-Namibia.png',
        'letters/i/i-3-djebelOuarkziz-morocco.png',
        'letters/i/i_5.jpg'
      ],
      e: [
        'letters/e/e-0-FirnfilledFjords-Tibet.png',
        'letters/e/e-1-SeaofOkhotsk.png',
        'letters/e/e-2-BellonaPlateau.png',
        'letters/e/e-3-breiðamerkurjökull-iceland.png'
      ]
    };

    const getLetterCycleDelay = (letter, imageCount) => {
      const variantFactor = Math.max(1, imageCount);
      const base = 32000;
      const interval = base / variantFactor;
      return Math.max(12000, interval);
    };

    const letterInfo = {
      k: [
        {
          title: 'K — Sirmilik National Park',
          coords: '63.4° N, 81.5° W',
          lat: 63.4,
          lng: -81.5,
          text: 'A remote Arctic landscape in Nunavut, chosen for its quiet, dramatic light and vast northern scale.'
        },
        {
          title: 'K — Golmund, China',
          coords: '41.8° N, 110.0° E',
          lat: 41.8,
          lng: 110.0,
          text: 'A wide, open setting with layered terrain, used to echo the letter’s broad, drifting energy.'
        }
      ],
      a: [
        {
          title: 'A — Hickman, Kentucky',
          coords: '37.5° N, 88.9° W',
          text: 'A rolling Appalachian valley, a reference to the grounded warmth and texture of home.'
        },
        {
          title: 'A — Farm Island, Maine',
          coords: '45.4° N, 68.6° W',
          lat: 45.4,
          lng: -68.6,
          text: 'Wooded edges and open water bring a slower, more reflective tone to this version of the letter.'
        },
        {
          title: 'A — Guakhmaz, Azerbaijan',
          coords: '41.4° N, 48.9° E',
          lat: 41.4,
          lng: 48.9,
          text: 'A different kind of scale and horizon, bringing a longer, brighter view into the letterform.'
        },
        {
          title: 'A — Yukon Delta, Alaska',
          coords: '61.4° N, 165.0° W',
          lat: 61.4,
          lng: -165.0,
          text: 'Expansive wetlands and tundra recall a more remote, wind-swept rhythm.'
        },
        {
          title: 'A — Lake Mjøsa, Norway',
          coords: '60.8° N, 10.7° E',
          lat: 60.8,
          lng: 10.7,
          text: 'A calm Nordic lake and mountain frame evoke stillness, depth, and long horizontal light.'
        }
      ],
      t: [
        {
          title: 'T — Liwa, UAE',
          coords: '23.1° N, 53.8° E',
          lat: 23.1,
          lng: 53.8,
          text: 'A desert edge with deep silence and open horizon, echoing expansive movement and stillness.'
        },
        {
          title: 'T — Lena River Delta',
          coords: '72.1° N, 126.6° E',
          lat: 72.1,
          lng: 126.6,
          text: 'A northern delta shaped by water and ice, giving this letter a more elemental and shifting feel.'
        }
      ],
      i: [
        {
          title: 'I — Borgarbyggð, Iceland',
          coords: '64.5° N, 21.9° W',
          lat: 64.5,
          lng: -21.9,
          text: 'Volcanic landforms and lava fields gave the letter its jagged, elemental character.'
        },
        {
          title: 'I — Canandaigua Lake, New York',
          coords: '42.9° N, 77.3° W',
          lat: 42.9,
          lng: -77.3,
          text: 'A bright inland lake and clear horizon add a quieter, more reflective note.'
        },
        {
          title: 'I — Etosha National Park, Namibia',
          coords: '18.8° S, 16.0° E',
          lat: -18.8,
          lng: 16.0,
          text: 'An open savanna and broad sky create a sense of width and structure in this version.'
        },
        {
          title: 'I — Djebel Ouarkziz, Morocco',
          coords: '29.5° N, 6.3° W',
          lat: 29.5,
          lng: -6.3,
          text: 'An arid mountain ridge brings a harder geometry and a sharper contrast of light and shadow.'
        },
        {
          title: 'I — Lake Mjosa, Norway',
          coords: '60.8° N, 10.7° E',
          lat: 60.8,
          lng: 10.7,
          text: 'A cooler, more grounded landscape that makes the letter feel steady and meditative.'
        }
      ],
      e: [
        {
          title: 'E — Firn-Filled Fjords, Tibet',
          coords: '30.0° N, 87.7° E',
          lat: 30.0,
          lng: 87.7,
          text: 'High-altitude ice and steep terrain suggest a calmer, almost dreamlike sense of elevation.'
        },
        {
          title: 'E — Sea of Okhotsk',
          coords: '59.0° N, 147.0° E',
          lat: 59.0,
          lng: 147.0,
          text: 'A cold, vast coastal waterline introduces motion and distance to this letterform.'
        },
        {
          title: 'E — Bellona Plateau',
          coords: '16.8° S, 130.8° E',
          lat: -16.8,
          lng: 130.8,
          text: 'A rugged and elevated plateau makes the letter feel more sculptural and atmospheric.'
        },
        {
          title: 'E — Breiðamerkurjökull, Iceland',
          coords: '64.1° N, 16.3° W',
          lat: 64.1,
          lng: -16.3,
          text: 'Glacial ice and dramatic terrain make this variant feel stark, expansive, and luminous.'
        }
      ]
    };

    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoText = document.getElementById('infoText');
    const infoCoords = document.getElementById('infoCoords');
    const globePin = document.getElementById('globePin');
    let activeGlobePin = null;

    const updateGlobePinPosition = () => {
      if (!activeGlobePin || !globe) return;
      const globeRect = document.getElementById('globeViz').getBoundingClientRect();
      const { x, y } = globe.getScreenCoords(activeGlobePin.lat, activeGlobePin.lng);
      globePin.style.left = `${globeRect.left + x}px`;
      globePin.style.top = `${globeRect.top + y}px`;
      globePin.style.opacity = '1';
    };

    const getDisplayedLetterInfo = (card) => {
      const letter = card.dataset.letter;
      const images = letterOptions[letter];
      const img = card.querySelector('img');
      const currentPath = new URL(img.src, window.location.href).pathname.replace(/^\/+/, '');
      const currentIndex = images.findIndex(path => currentPath.endsWith(path));
      const safeIndex = currentIndex === -1 ? 0 : currentIndex;
      const variants = letterInfo[letter] || [];
      return variants[safeIndex] || variants[0] || null;
    };

    const showLetterInfo = (card) => {
      const info = getDisplayedLetterInfo(card);
      if (!info) return;
      infoTitle.textContent = info.title;
      infoText.textContent = info.text;
      infoCoords.textContent = `Coordinates: ${info.coords}`;

      const target = { lat: info.lat, lng: info.lng, altitude: 1.6 };
      globe.controls().autoRotate = false;
      globe.pointOfView(target, 2200);

      activeGlobePin = { lat: info.lat, lng: info.lng };
      globe.pointsData([
        {
          lat: info.lat,
          lng: info.lng,
          color: '#ff5b6e',
          altitude: 0.15,
          size: 0.5
        }
      ])
        .pointLat('lat')
        .pointLng('lng')
        .pointAltitude('altitude')
        .pointRadius('size')
        .pointColor('color');

      setTimeout(() => {
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.45;
      }, 2200);

      infoPanel.classList.add('visible');
    };

    const rotateLetter = (card) => {
      const letter = card.dataset.letter;
      const images = letterOptions[letter];
      if (!images || images.length < 2) return;

      const img = card.querySelector('img');
      const currentPath = new URL(img.src, window.location.href).pathname.replace(/^\/+/, '');
      const currentIndex = images.findIndex(path => currentPath.endsWith(path));
      const nextIndex = currentIndex === -1 ? 1 : (currentIndex + 1) % images.length;

      card.classList.add('active');
      img.src = images[nextIndex];
      card.dataset.currentIndex = String(nextIndex);

      setTimeout(() => card.classList.remove('active'), 250);

      const nextDelay = getLetterCycleDelay(letter, images.length);
      setTimeout(() => rotateLetter(card), nextDelay);
    };

    const letterOffsets = {
      k: 0,
      a: 1600,
      t: 4200,
      i: 7600,
      e: 11200
    };

    document.querySelectorAll('.letter-card').forEach(card => {
      const letter = card.dataset.letter;
      const images = letterOptions[letter];
      if (!images || images.length < 2) return;

      const delay = getLetterCycleDelay(letter, images.length) + (letterOffsets[letter] || 0);
      setTimeout(() => rotateLetter(card), delay);

      card.addEventListener('click', () => {
        showLetterInfo(card);
      });
    });

    const sunPosAt = dt => {
      const day = new Date(+dt).setUTCHours(0, 0, 0, 0);
      const t = solar.century(dt);
      const longitude = (day - dt) / 864e5 * 360 - 180;
      return [longitude - solar.equationOfTime(t) / 4, solar.declination(t)];
    };

    let dt = +new Date();
    const timeEl = document.getElementById('time');
    const audioEl = document.getElementById('backgroundAudio');
    const audioToggle = document.getElementById('audioToggle');
    const globe = new Globe(document.getElementById('globeViz'));

    audioEl.muted = false;
    audioEl.loop = true;
    audioEl.volume = 0.7;

    const toggleAudio = () => {
      audioEl.muted = !audioEl.muted;
      audioToggle.textContent = audioEl.muted ? '🔇' : '🔊';
      audioToggle.classList.toggle('muted', audioEl.muted);
      if (!audioEl.muted && audioEl.paused) {
        audioEl.play().catch(() => {});
      }
    };

    audioToggle.addEventListener('click', toggleAudio);
    audioEl.play().catch(() => {});

    globe.pointOfView({ lat: 18, lng: -12, altitude: 4.1 }, 2000);
    globe.pointsData([])
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('altitude')
      .pointRadius('size')
      .pointColor('color');
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.45;
    globe.controls().enableDamping = true;

    Promise.all([
      new TextureLoader().loadAsync('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-day.jpg'),
      new TextureLoader().loadAsync('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
    ]).then(([dayTexture, nightTexture]) => {
      const material = new ShaderMaterial({
        uniforms: {
          dayTexture: { value: dayTexture },
          nightTexture: { value: nightTexture },
          sunPosition: { value: new Vector2() },
          globeRotation: { value: new Vector2() }
        },
        vertexShader: dayNightShader.vertexShader,
        fragmentShader: dayNightShader.fragmentShader
      });

      globe.globeMaterial(material)
        .backgroundImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png')
        .onZoom(({ lng, lat }) => material.uniforms.globeRotation.value.set(lng, lat));

      requestAnimationFrame(() => {
        (function animate() {
          dt += VELOCITY * 60 * 1000;
          timeEl.textContent = new Date(dt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          material.uniforms.sunPosition.value.set(...sunPosAt(dt));
          requestAnimationFrame(animate);
        })();
      });
    });
  </script>
</body>
</html>
